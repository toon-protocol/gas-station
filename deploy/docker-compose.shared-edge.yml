# =============================================================================
# The shared-edge overlay (infra#24, infra ADR 0001, TOON_Network#28)
# =============================================================================
# The devnet is moving onto one Linode, shared by the relay, store, gas
# station, workload gateway and faucet nodes, behind one shared Caddy edge
# that owns ports 80 and 443. This node keeps its own connector, keys and
# hostnames -- only its own TLS front goes away.
#
# Turned on the way the provider's HIDDEN overlay is: one line in .env --
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.shared-edge.yml
#
# docker compose reads COMPOSE_FILE from .env itself, so every `docker
# compose` command run in this directory -- auto-apply.sh's included -- sees
# the merged stack. A `.env` with no COMPOSE_FILE line runs docker-compose.yml
# alone, exactly as before this file existed.
#
# What it does:
#
#   nginx, certbot, watchtower   DISABLED (`profiles: [disabled]` -- a
#                                 profile nothing ever activates). No public
#                                 port 80 or 443 is bound by this bundle at
#                                 all; the shared edge owns both, on the host,
#                                 once. auto-apply.sh already pulls the pinned
#                                 connector and gas-station images unattended,
#                                 so losing watchtower here costs nothing.
#   connector                    joins the external `edge-gas` network under
#                                 the stable alias `gas-proxy`, so the edge
#                                 can reach it at `gas-proxy:4000` for
#                                 proxy.gas.${DOMAIN}. Its 127.0.0.1:4000
#                                 loopback publish from docker-compose.yml is
#                                 untouched -- bootstrap.sh and auto-apply.sh
#                                 still read it there.
#   gas-station                  joins `edge-gas` under the alias `gas-web`,
#                                 so the edge can reach gas.${DOMAIN} at
#                                 `gas-web:3400`. Its job door (:3300) is
#                                 still never published or aliased anywhere --
#                                 see README.md "Privacy invariant".
#
# `edge-gas` IS THIS NODE'S OWN NETWORK, not a flat network shared by every
# node on the host (shared contract v2). infra#24's edge project creates one
# fixed-named network per node (`edge-relay`, `edge-store`, `edge-gas`,
# `edge-gateway`, `edge-faucet`) and Caddy joins all five; each node's own
# overlay joins only its own. On one flat network any node could reach any
# other node's connector `/admin` or the gateway's handover port -- per-node
# networks mean only the edge itself can reach a node.
#
# See deploy/README.md "Running behind the shared edge" for the alias:port
# table this was worked out from (deploy/nginx/node.conf.template), and for
# everything nginx does today that the edge has to replicate -- the rate
# limit and the CORS header on /ilp/identity matter most.
#
# `networks: default: {}` is repeated on both services below because ADDING
# an explicit `networks:` key to a service that otherwise gets the implicit
# default network REPLACES it rather than extending it -- so without this,
# joining `edge-gas` would silently cut the connector and the app off from
# each other (the connector proxies to gas-station:3300 over that network).
# Same pattern as the provider's `docker-compose.hidden.yml`.
#
# ── mem_limit ────────────────────────────────────────────────────────────────
# Sized from real docker stats measurements taken on the shared devnet host
# itself on 2026-09-25 (infra#25 step 2), now that the host is confirmed to
# be a 1 GB Linode nanode (961 MB total, ~350 MB already used by the OS and
# Docker) rather than the 2 GB host this overlay's numbers used to assume.
#
# Idle `docker stats` on that host: connector 3 MB, gas-station app 28 MB.
#
# connector: 64m is ~4x its measured 3 MB idle -- plenty of headroom for a
# lightweight proxy with no heap cap of its own.
#
# gas-station: this overlay now also overrides NODE_OPTIONS (in the service's
# `environment` below) to --max-old-space-size=192, down from the base's 256
# (docker-compose.yml ~:93), tightening the V8 heap cap to fit the 1 GB host.
# 256m leaves ~64 MB of headroom above that 192 MB heap cap -- room for the
# non-heap part of a Node process (native modules, buffers, the process
# itself), which the heap cap alone does not cover.
#
# nginx, certbot and watchtower are DISABLED under this overlay (`profiles:
# [disabled]`, below) and so cost nothing on a box actually running it --
# their mem_limit values (32m/32m/64m) are unchanged by this measurement
# pass, only so a stray `--profile disabled` run or a future re-enable is not
# left with no limit at all.
# =============================================================================

services:
  connector:
    # measured idle 3 MB on 2026-09-25 (infra#25 step 2); limit ≈4x idle
    mem_limit: 64m
    networks:
      default: {}
      edge-gas:
        aliases: [gas-proxy]

  gas-station:
    # measured idle 28 MB on 2026-09-25 (infra#25 step 2); the overlay's own
    # NODE_OPTIONS below caps the V8 heap at 192 MB (down from the base's
    # 256), and 256m leaves the same ~64 MB headroom above that cap for the
    # non-heap part of the process, on the shared 1 GB nanode host.
    mem_limit: 256m
    environment:
      NODE_OPTIONS: --max-old-space-size=192
    networks:
      default: {}
      edge-gas:
        aliases: [gas-web]

  # `profiles: [disabled]` names a profile nothing ever activates (no
  # COMPOSE_PROFILES, no `--profile` flag anywhere in this repo), which is how
  # a compose overlay switches a service off: `docker compose up -d` (and
  # `config`, with no profile given) skips it entirely, rather than starting
  # it and leaving it unused.
  nginx:
    mem_limit: 32m
    profiles: [disabled]

  certbot:
    mem_limit: 32m
    profiles: [disabled]

  watchtower:
    mem_limit: 64m
    profiles: [disabled]

networks:
  # Created and owned by infra#24's edge project, as this node's own network
  # (one per node, not a flat network shared by every node on the host --
  # see the comment above). This node only joins it.
  edge-gas:
    external: true
