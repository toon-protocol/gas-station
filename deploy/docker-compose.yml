# =============================================================================
# The gas-station box — one host, five containers
# =============================================================================
#   nginx        the public TLS edge (the only thing bound to a public port)
#   connector    the payment proxy: meters + settles, then proxies to the app
#   gas-station  the job backend: POST /gas -> a signed, broadcast transaction
#   certbot      renews the certificate
#   watchtower   recreates the app containers when their tag moves
#
#   internet ──▶ nginx :443 ──┬──▶ connector :4000 ──▶ gas-station :3300 ──▶ chain
#                             └──▶ gas-station :3400  (health)
#
# Bring it up:  ./render.sh && docker compose up -d
# See ./README.md — nothing here works without the key files and .env it lists.
# =============================================================================

name: gas-station

services:
  # ── The payment proxy ──────────────────────────────────────────────────────
  # Published on the LOOPBACK only. nginx is what faces the internet; binding
  # this to 0.0.0.0 would put the paid edge on the public internet past ufw
  # (docker's iptables rules bypass ufw — see README § Privacy invariant).
  connector:
    image: ghcr.io/toon-protocol/connector:rust-2026.08.28.1
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      - ./connector.toml:/app/config/connector.toml:ro
      - ./signer.key:/app/data/signer.key:ro
      - ./settlement.key:/app/data/settlement.key:ro
      - ./settlement-solana.key:/app/data/settlement-solana.key:ro
      # The operator surface's two credentials — see connector.toml's
      # [operator]. The bearer token gates reads; the allowlist holds the
      # PUBLIC halves of the keys allowed to sign a write, one per line. Both
      # are written by ./render.sh from .env, so the rendered connector.toml
      # names paths and carries no credential of its own.
      - ./operator-bearer.token:/app/data/operator-bearer.token:ro
      - ./operator-write.keys:/app/data/operator-write.keys:ro
      - connector_state:/app/state
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      # The connector has no /health route. GET /ilp/identity is unauthenticated
      # and answers 200 only once the process is serving AND has read its signer
      # key file — `docker ps` showing "Up" proves neither.
      # 127.0.0.1, never localhost: the listener is IPv4-only, but "localhost"
      # in a container can resolve to ::1, where nothing is listening.
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:4000/ilp/identity || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ── The job backend ────────────────────────────────────────────────────────
  # No `ports:` at all. The connector reaches it over the compose network as
  # the termination of a paid route, and nginx serves its health endpoint.
  # Nothing else should be able to reach it: a public path to POST /gas would
  # be a free door — anyone who found the URL would get their transactions
  # signed and their gas paid out of this box's float, for nothing.
  gas-station:
    image: ghcr.io/toon-protocol/gas-station:release
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    environment:
      NODE_NOSTR_SECRET_KEY: ${GAS_STATION_NOSTR_SECRET_KEY:?set GAS_STATION_NOSTR_SECRET_KEY in .env (64-char hex)}
      HANDLER_PORT: '3300'
      BLS_PORT: '3400'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # ── The two chains. At least one must be set or the app refuses to
      # boot: a gas station with no chain would answer nothing.
      #
      # kind:5096 — Solana. A DEDICATED fee-payer key: this one co-signs other
      # people's transactions, so it is not the connector's settlement key
      # (that is a file, mounted into a different container) and not a float
      # for anything else.
      GAS_STATION_SOLANA_SECRET_KEY: ${GAS_STATION_SOLANA_SECRET_KEY:-}
      SOLANA_NETWORK: ${SOLANA_NETWORK:-devnet}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      GAS_STATION_CHANNEL_PROGRAM_ID: ${GAS_STATION_CHANNEL_PROGRAM_ID:-}
      GAS_STATION_QUOTE_TTL_MS: ${GAS_STATION_QUOTE_TTL_MS:-}
      GAS_STATION_MAX_LAMPORTS_CEILING: ${GAS_STATION_MAX_LAMPORTS_CEILING:-}
      GAS_STATION_TIERS_JSON: ${GAS_STATION_TIERS_JSON:-}
      # kind:5098 — EVM. A JSON array of {chainId, rpcUrl, forwarderAddress,
      # tokenNetworkAddress, relayerPrivateKey}, one dedicated relayer wallet
      # per chain. Adding a chain is an entry here, not a code change.
      EVM_GAS_STATION_CONFIG_JSON: ${EVM_GAS_STATION_CONFIG_JSON:-}
      EVM_GAS_STATION_QUOTE_TTL_MS: ${EVM_GAS_STATION_QUOTE_TTL_MS:-}
      EVM_GAS_STATION_MAX_GAS: ${EVM_GAS_STATION_MAX_GAS:-}
      # Node's default heap target assumes it owns the machine. This box is a
      # 1GB nanode running five containers.
      NODE_OPTIONS: --max-old-space-size=256
    expose: ['3300', '3400']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3400/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── The TLS edge ───────────────────────────────────────────────────────────
  # Deliberately NOT Watchtower-labelled. nginx holds the resolver that lets
  # every other container survive being recreated at a new address; recreating
  # it on an upstream nginx:alpine push would be an unreviewed change to the
  # one component whose job is to outlive the others.
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    restart: unless-stopped

  # Holds the renewal timer; not Watchtower-labelled, same reasoning.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  # ── Unattended updates ─────────────────────────────────────────────────────
  # `--label-enable` means it ignores every container that does not carry the
  # enable label, so it only ever touches connector and gas-station.
  # Pinned, rather than floating on :latest — otherwise a future Watchtower
  # release changes this box's deploy behaviour with nothing in git to point
  # at (which is exactly the defect it exists to fix for everything else).
  # Not labelled itself.
  watchtower:
    image: containrrr/watchtower:1.7.1
    environment:
      DOCKER_API_VERSION: '1.44'
    command: ['--label-enable', '--interval', '60', '--cleanup']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  # The claim watermark. Back this up; losing it hands every payer their
  # already-spent claims back as free service.
  connector_state:
  certbot_conf:
  certbot_www:
