name: Agent image

# Minimal build-only check for the sandcastle agent container image.
# Proves the `.sandcastle/Dockerfile` (node:22-bookworm + gh + Claude Code CLI +
# the mattpocock-skills plugin + corepack/pnpm) builds. This is not the runner
# itself; that is agent-implement.yml. It is also not the published app image
# (Dockerfile.gas-station).

on:
  pull_request:
    paths:
      - '.sandcastle/**'
      - '.github/workflows/agent-image.yml'
  workflow_dispatch:

jobs:
  build-image:
    name: Build sandcastle agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Docker is preinstalled on ubuntu-latest GitHub-hosted runners.
      # `sandcastle docker build-image` builds .sandcastle/Dockerfile,
      # defaulting the AGENT_UID/AGENT_GID build args to the runner's uid/gid.
      # The image is tagged `sandcastle:<dir-name>` — here `sandcastle:gas-station`.
      - name: Build agent image
        run: npx --yes @ai-hero/sandcastle@0.12.0 docker build-image

      - name: Verify toolchain inside image
        run: |
          docker run --rm --entrypoint bash sandcastle:gas-station -lc '
            set -e
            node --version
            gh --version | head -1
            # pnpm resolves via corepack; the mounted repo pins pnpm@8.15.9
            # through its packageManager field at runtime.
            corepack --version
            test "$(whoami)" = "agent"
            test -x /home/agent/.local/bin/claude
            # The runner starts every session with a mattpocock-skills slash command.
            claude plugin list | grep -q mattpocock-skills
          '

      # Proving the tools exist is not proving the gate runs. Install and run the
      # repo's own gate inside the image, on the mounted checkout, the way the
      # runner's sandbox does.
      - name: Verify the agent can run this repo's gate
        run: |
          docker run --rm \
            -v "$PWD":/home/agent/workspace -w /home/agent/workspace \
            --entrypoint bash sandcastle:gas-station -lc '
              set -euo pipefail
              pnpm install --frozen-lockfile
              pnpm build
              pnpm typecheck
              pnpm test
            '
